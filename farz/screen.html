<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فرز</title>
<link rel="icon" href="/mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Nurunim: ground #0B0B0C, cream #EDE7D8, orange #D34513, IBM Plex Sans Arabic */
:root {
  --ground: #0b0b0c; --panel: #121213; --raise: #1a1a1b; --line: #2a2926;
  --cream: #ede7d8; --cream-2: #b9b3a6; --orange: #d34513; --orange-ink: #ec6a3c;
  --font: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --mono: "IBM Plex Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--ground); color: var(--cream); font: 15px/1.65 var(--font); display: flex; flex-direction: column; }
button, textarea { font: inherit; color: inherit; }
.ltr { direction: ltr; unicode-bidi: isolate; font-family: var(--mono); font-size: 14px; }

header { position: relative; display: flex; align-items: center; gap: 28px; padding: 14px 24px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 12px; }
.brand img { width: 26px; height: auto; display: block; }
.brand h1 { margin: 0; font-size: 20px; font-weight: 700; }
.progress { font-size: 15px; }
.note { margin-inline-start: auto; color: var(--cream-2); font-size: 14px; }
.meter { position: absolute; inset-inline: 0; bottom: -1px; height: 2px; }
.meter i { display: block; height: 100%; background: var(--orange); transition: width .3s; }

main { flex: 1; min-height: 0; display: grid; grid-template-columns: 340px minmax(0, 1fr); }
.detail { display: grid; grid-template-columns: minmax(0, 1fr) 320px; min-height: 0; }
.list { border-inline-end: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
.tabs { position: sticky; top: 0; display: flex; gap: 16px; padding: 0 14px; overflow-x: auto; scrollbar-width: none; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 1; }
.tabs button { border: 0; background: none; padding: 12px 0 10px; white-space: nowrap; cursor: pointer; color: var(--cream-2); font-size: 14px;
  border-bottom: 2px solid transparent; }
.tabs button.on { color: var(--cream); border-bottom-color: var(--orange); font-weight: 500; }
.tabs b { font-weight: 500; margin-inline-start: 5px; }
.item { display: block; width: 100%; text-align: start; border: 0; border-bottom: 1px solid var(--line);
  background: none; padding: 14px 16px; cursor: pointer; }
.item:hover { background: var(--raise); }
.item.on { background: var(--raise); box-shadow: inset -3px 0 0 var(--orange); }
.item .top { display: flex; align-items: baseline; gap: 10px; font-size: 14px; font-weight: 500; }
.item .top .pri { margin-inline-start: auto; font-weight: 400; color: var(--cream-2); }
.item .preview { margin-top: 4px; font-size: 14px; color: var(--cream-2); display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden; }
.item.done { opacity: .55; }
.hot { color: var(--orange-ink) !important; }

.work { overflow-y: auto; padding: 28px 36px 48px; }
.work h2 { margin: 0; font-size: 22px; font-weight: 700; }
.sub { color: var(--cream-2); margin: 2px 0 20px; }
.bubble { background: var(--raise); border-radius: 14px; padding: 16px 18px; white-space: pre-wrap; max-width: 720px; font-size: 16px; }
.label { margin: 28px 0 10px; font-weight: 500; }
.label span { color: var(--cream-2); font-weight: 400; margin-inline-start: 6px; }
textarea { display: block; width: 100%; max-width: 720px; min-height: 120px; resize: vertical; border: 1px solid var(--line);
  border-radius: 14px; padding: 16px 18px; background: var(--panel); line-height: 1.75; font-size: 16px; overflow: hidden; }
textarea:focus { outline: none; border-color: var(--orange); }
.flag { max-width: 720px; margin-top: 10px; padding: 10px 14px; border-inline-start: 3px solid var(--orange); background: var(--raise); }
.actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--cream-2); }
.btn.main { background: var(--orange); border-color: var(--orange); color: var(--cream); }
.btn.main:hover { background: #b93b10; border-color: #b93b10; }
.result { margin-top: 16px; max-width: 720px; color: var(--cream-2); }

.side { border-inline-start: 1px solid var(--line); overflow-y: auto; padding: 24px; }
.side h3 { margin: 0 0 12px; font-size: 15px; font-weight: 700; }
.side section { padding-bottom: 20px; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
.side section:last-child { border-bottom: 0; }
dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0; }
dt { color: var(--cream-2); }
dd { margin: 0; }
.sure { color: var(--cream-2); margin: 0 10px; direction: ltr; unicode-bidi: isolate; }
.reasons { margin: 0; padding: 0; list-style: none; }
.reasons li { padding: 2px 12px; border-inline-start: 3px solid var(--orange); margin-bottom: 10px; }
.txn { padding: 10px 12px; background: var(--raise); border-radius: 10px; margin-bottom: 8px; }
.empty { color: var(--cream-2); }

@media (max-width: 1100px) {
  main { grid-template-columns: 330px minmax(0, 1fr); }
  .detail { display: block; overflow-y: auto; }
  .work, .side { overflow: visible; }
  .side { border-inline-start: 0; border-top: 1px solid var(--line); }
}
@media (max-width: 720px) {
  body { display: block; height: auto; }
  header { gap: 16px; padding: 12px 16px; }
  main, .detail { display: block; }
  .list { max-height: 45vh; }
  .work { padding: 20px 16px; }
  .side { padding: 20px 16px; }
  .note { display: none; }
}
</style>
</head>
<body>
<header>
  <div class="brand"><img src="/mark.svg" alt="Nurunim"><h1>فرز</h1></div>
  <div class="progress" id="progress"></div>
  <div class="note">تجربة، ما يندز أي رد وكل البيانات مخترعة</div>
  <div class="meter"><i id="meter" style="width:0"></i></div>
</header>
<main>
  <nav class="list" id="list"></nav>
  <div class="detail" id="detail">
    <section class="work" id="work"><p class="empty">اختار رسالة من القائمة</p></section>
    <aside class="side" id="side"></aside>
  </div>
</main>
<script>
const CAT = { failed_transfer: "تحويل فاشل أو معلق", wrong_recipient: "تحويل لرقم غلط", login_access: "الدخول للحساب",
  agent_dispute: "مشكلة ويا وكيل", card_issue: "البطاقة", bill_payment: "دفع فاتورة أو شحن", fraud_scam: "احتيال",
  account_kyc: "توثيق الحساب", general_inquiry: "استفسار عام" };
const PRI = { urgent: "عاجل", high: "عالي", normal: "عادي", low: "واطي" };
const TEAM = { transfers: "التحويلات", account_access: "الحسابات", agent_network: "الوكلاء", cards: "البطاقات",
  payments: "المدفوعات", fraud: "الحماية من الاحتيال", kyc: "توثيق الحسابات", general: "خدمة الزبائن" };
const LEDGER = { match: "يطابق سجل المحفظة", mismatch: "المبلغ ما يطابق السجل", not_found: "ما لگينا العملية بالسجل",
  no_details: "ماكو مبلغ أو رقم أو رقم عملية بالرسالة" };
const TYPE = { p2p_send: "تحويل", p2p_receive: "استلام", intl_transfer: "حوالة خارجية", bill_payment: "فاتورة",
  topup: "شحن رصيد", agent_cash_in: "إيداع عند وكيل", agent_cash_out: "سحب عند وكيل", card_payment: "دفع بالبطاقة" };
const STATUS = { success: "ناجحة", failed: "فاشلة", pending: "قيد المعالجة", reversed: "مرجّعة" };
const CHOICE = { approve: "اعتمدت المسودة", edit: "عدّلت وأعتمدت", take_over: "استلمتها بنفسك" };

let tickets = [], actions = {}, tab = "person", current = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (x) => Math.round((x || 0) * 100) + "%";
const money = (n) => n == null ? "" : Number(n).toLocaleString("en-US") + " دينار";

function reason(r) {
  let m;
  if ((m = r.match(/^not sure of category \((\S+) ([\d.]+)\)/))) return `مو متأكد من نوع المشكلة (${CAT[m[1]] || "؟"}، ${pct(+m[2])})`;
  if ((m = r.match(/^not sure of priority \((\S+) ([\d.]+)\)/))) return `مو متأكد من الأهمية (${PRI[m[1]] || "؟"}، ${pct(+m[2])})`;
  if (r === "fraud or scam") return "احتيال، لازم موظف يشوفها";
  if (r === "urgent") return "عاجلة";
  if (r === "scam signs in the text") return "بالرسالة علامات احتيال";
  if (r === "text tries to instruct the system") return "الرسالة تحاول تعطي أوامر للنظام";
  if (r.startsWith("ledger: ")) return `السجل ما يطابق كلام الزبون: <span class="ltr">${esc(r.slice(8))}</span>`;
  return esc(r);
}

function counts() {
  const done = Object.keys(actions).length;
  $("progress").textContent = `خلصت ${done} من ${tickets.length}`;
  $("meter").style.width = (tickets.length ? done / tickets.length * 100 : 0) + "%";
}
const hot = (p) => p === "urgent" || p === "high" ? "hot" : "";

function list() {
  const shown = tickets.filter((t) => tab === "all" || (tab === "done" ? actions[t.id] : !actions[t.id] && t.route === tab));
  const left = (r) => tickets.filter((t) => !actions[t.id] && t.route === r).length;
  const tabs = [["person", "تحتاج موظف", left("person")], ["team_queue", "جاهزة بمسودة", left("team_queue")],
    ["done", "خلصت", Object.keys(actions).length], ["all", "الكل", ""]];
  $("list").innerHTML = `<div class="tabs">${tabs.map(([k, v, n]) => `<button class="${tab === k ? "on" : ""}" data-tab="${k}">${v}<b>${n}</b></button>`).join("")}</div>` +
    (shown.length ? shown.map((t) => `<button class="item ${t.id === current ? "on" : ""} ${actions[t.id] && tab !== "done" ? "done" : ""}" data-id="${t.id}">
      <div class="top"><span>${CAT[t.category] || "غير معروف"}</span>
      <span class="pri ${actions[t.id] ? "" : hot(t.priority)}">${actions[t.id] ? CHOICE[actions[t.id].choice] : PRI[t.priority] || ""}</span></div>
      <div class="preview" dir="auto">${esc(t.text)}</div></button>`).join("") : `<p class="empty" style="padding:16px">ماكو رسائل هنا</p>`);
}

function open(id) {
  current = id;
  $("detail").scrollTop = $("work").scrollTop = $("side").scrollTop = 0;
  const t = tickets.find((x) => x.id === id), a = actions[id];
  const lang = t.reply_language === "english" ? "en" : "ar";
  $("work").innerHTML = `
    <h2>${CAT[t.category] || "غير معروف"}</h2>
    <div class="sub">محفظة الزبون <span class="ltr">${esc(t.wallet_phone)}</span></div>
    <div class="bubble" dir="auto">${esc(t.text)}</div>
    <div class="label">مسودة الرد<span>${t.draft_writer === "astra" ? "كتبتها Astra" : "من قالب ثابت"}</span></div>
    <textarea id="draft" dir="${lang === "en" ? "ltr" : "rtl"}" lang="${lang}">${esc(a && a.sent_text != null ? a.sent_text : t.draft)}</textarea>
    ${(t.draft_problems || []).length ? `<div class="flag">انتبه، الفحص لگى بالمسودة: <span class="ltr">${esc(t.draft_problems.join("; "))}</span></div>` : ""}
    <div class="actions">
      <button class="btn main" data-choice="approve" title="Ctrl+Enter">اعتمد المسودة</button>
      <button class="btn" data-choice="edit">احفظ تعديلي واعتمده</button>
      <button class="btn" data-choice="take_over">أستلمها بنفسي</button>
    </div>
    ${a ? `<div class="result">${CHOICE[a.choice]}، ${esc(a.time)}</div>` : ""}`;
  grow($("draft"));
  const ld = t.ledger || {};
  $("side").innerHTML = `
    <section><h3>شنو لگى فرز</h3><dl>
      <dt>المشكلة</dt><dd>${CAT[t.category] || "؟"}<span class="sure">${pct(t.category_confidence)}</span></dd>
      <dt>الأهمية</dt><dd><span class="${hot(t.priority)}">${PRI[t.priority] || "؟"}</span><span class="sure">${pct(t.priority_confidence)}</span></dd>
      <dt>الفريق</dt><dd>${TEAM[t.team] || "؟"}</dd>
      <dt>وين راحت</dt><dd>${t.route === "person" ? "لموظف أولاً" : "لقائمة الفريق"}</dd>
      <dt>رقم الرسالة</dt><dd><span class="ltr">${esc(t.id)}</span></dd>
    </dl></section>
    ${t.reasons && t.reasons.length ? `<section><h3>ليش وصلتك</h3><ul class="reasons">${t.reasons.map((r) => `<li>${reason(r)}</li>`).join("")}</ul></section>` : ""}
    <section><h3>التفاصيل من الرسالة</h3><dl>
      <dt>المبلغ</dt><dd>${t.entities.amount != null ? money(t.entities.amount) : '<span class="empty">ماكو</span>'}</dd>
      <dt>رقم الهاتف</dt><dd>${t.entities.phone ? `<span class="ltr">${esc(t.entities.phone)}</span>` : '<span class="empty">ماكو</span>'}</dd>
      <dt>رقم العملية</dt><dd>${t.entities.reference ? `<span class="ltr">${esc(t.entities.reference)}</span>` : '<span class="empty">ماكو</span>'}</dd>
    </dl></section>
    <section><h3>سجل المحفظة</h3>
      <p style="margin:0 0 10px">${t.ledger ? LEDGER[ld.outcome] || esc(ld.outcome) : '<span class="empty">ما انفحص، المشكلة مو عن عملية</span>'}</p>
      ${(t.ledger_rows || []).map((x) => `<div class="txn"><div class="ltr">${esc(x.ref)}</div>
        <div>${TYPE[x.type] || esc(x.type)}، ${money(x.amount)}</div>
        <div>${STATUS[x.status] || esc(x.status)}${x.debited ? "، منخصم" : ""}</div>
        <div class="ltr">${esc(x.time.replace("T", " "))}</div></div>`).join("")}
    </section>`;
  list();
}

async function act(choice) {
  if (!current) return;
  const text = $("draft").value;
  const res = await fetch("/api/action", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: current, choice, text }) });
  if (!res.ok) return alert("ما انحفظ، جرب مرة ثانية");
  actions[current] = await res.json();
  counts();
  const next = tickets.find((t) => !actions[t.id] && (tab === "all" || t.route === tab));
  next ? open(next.id) : open(current);
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.tab) { tab = b.dataset.tab; list(); }
  else if (b.dataset.id) open(b.dataset.id);
  else if (b.dataset.choice) act(b.dataset.choice);
});
function grow(el) { el.style.height = "auto"; el.style.height = el.scrollHeight + 2 + "px"; }
document.addEventListener("input", (e) => { if (e.target.id === "draft") grow(e.target); });
document.fonts.ready.then(() => { if ($("draft")) grow($("draft")); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && current) { e.preventDefault(); act("approve"); }
});

fetch("/api/queue").then((r) => r.json()).then((d) => {
  tickets = d.tickets; actions = d.actions || {};
  counts(); list();
  const first = tickets.find((t) => !actions[t.id] && t.route === tab);
  if (first) open(first.id);
});
</script>
</body>
</html>
