<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فرز</title>
<link rel="icon" href="/mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Nurunim: orange #D34513, cream #EDE7D8, ground #0B0B0C, IBM Plex Sans Arabic. Layout after the Vertix dashboard. */
:root {
  --canvas: #e6e0d2; --app: #f2ede2; --card: #fffdf8; --panel: #f2ede3; --line: #e4ddcf;
  --fg: #0b0b0c; --muted: #6a655b; --primary: #0b0b0c; --primary-fg: #fffdf8; --soft: #e9e3d6;
  --orange: #d34513; --orange-ink: #b53a0f; --orange-soft: #f8e3d8; --green: #1d7a4b; --green-soft: #dcefe3;
  --red: #b8321a; --red-soft: #f6ddd5;
  --font: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif; --mono: "IBM Plex Mono", Consolas, monospace;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --canvas: #050505; --app: #0b0b0c; --card: #151516; --panel: #1d1d1e; --line: #29282a;
  --fg: #ede7d8; --muted: #a49e91; --primary: #ede7d8; --primary-fg: #0b0b0c; --soft: #232324;
  --orange-ink: #ef7444; --orange-soft: #3a1b10; --green: #5cc995; --green-soft: #143222;
  --red: #f07a5f; --red-soft: #3b1711;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { overflow-x: clip; background: var(--canvas); color: var(--fg); font: 15px/1.6 var(--font); font-variant-numeric: tabular-nums; min-height: 100vh; }
button, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
svg { display: block; }
.ltr { direction: ltr; unicode-bidi: isolate; font-family: var(--mono); font-size: .92em; }
.muted { color: var(--muted); }

.app { margin: clamp(10px, 2.6vw, 40px); background: var(--app); border-radius: 32px; padding: 22px clamp(14px, 2.4vw, 36px) 36px; min-height: calc(100vh - 2 * clamp(10px, 2.6vw, 40px)); }

/* top bar */
.top { display: flex; align-items: center; gap: 14px; }
.pill { background: var(--card); border-radius: 999px; height: 54px; display: flex; align-items: center; padding: 0 8px; }
.logo { padding-inline-end: 20px; gap: 10px; font-weight: 700; font-size: 18px; }
.logo .mk { width: 40px; height: 40px; border-radius: 50%; background: var(--orange); display: grid; place-items: center; }
.logo .mk i { width: 20px; height: 22px; background: #ede7d8; -webkit-mask: url(/mark.svg) center / contain no-repeat; mask: url(/mark.svg) center / contain no-repeat; }
.nav { position: relative; margin-inline: auto; gap: 2px; }
.nav button { position: relative; z-index: 1; border: 0; background: none; height: 40px; padding: 0 20px; border-radius: 999px; font-size: 15px; transition: color .3s; }
.nav button.on { color: var(--primary-fg); }
.nav .ind { position: absolute; top: 7px; height: 40px; border-radius: 999px; background: var(--primary); transition: left .35s cubic-bezier(.6, 0, .2, 1), width .35s cubic-bezier(.6, 0, .2, 1); }
.icons { gap: 2px; }
.iconbtn { width: 40px; height: 40px; border: 0; background: none; border-radius: 50%; display: grid; place-items: center; }
.iconbtn:hover { background: var(--soft); }
.me { gap: 12px; padding-inline-end: 22px; }
.ring { width: 40px; height: 40px; position: relative; }
.ring svg { transform: rotate(-90deg); }
.me b { display: block; font-weight: 600; line-height: 1.25; }
.me small { display: block; color: var(--muted); font-size: 13px; line-height: 1.3; }
.burger { display: none; }

/* page heading */
.head { margin: 34px 4px 26px; }
.head h1 { margin: 0; font-size: clamp(28px, 3.2vw, 40px); font-weight: 500; letter-spacing: -.01em; line-height: 1.25; }
.head p { margin: 6px 0 0; color: var(--muted); }

/* cards */
.card { background: var(--card); border-radius: 24px; padding: 20px; min-width: 0; }
.card h2 { margin: 0; font-size: 18px; font-weight: 600; }
.card .sub { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.inner { background: var(--panel); border-radius: 18px; padding: 14px 16px; }
.big { font-size: 30px; font-weight: 600; line-height: 1.2; letter-spacing: -.01em; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 13px; font-weight: 500; background: var(--soft); white-space: nowrap; }
.chip.hot { background: var(--orange-soft); color: var(--orange-ink); }
.chip.good { background: var(--green-soft); color: var(--green); }
.chip.bad { background: var(--red-soft); color: var(--red); }
.btn { height: 42px; padding: 0 22px; border-radius: 999px; border: 0; background: var(--soft); font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
.btn:hover { filter: brightness(.96); }
.btn.dark { background: var(--primary); color: var(--primary-fg); }
.btn.light { background: #fffdf8; color: #0b0b0c; }
.btn:disabled { opacity: .5; cursor: default; }
.stripes { background: repeating-linear-gradient(-45deg, var(--orange) 0 2px, transparent 2px 6px); }

/* overview */
.grid1 { display: grid; grid-template-columns: 1.05fr 1fr 1.1fr; gap: 20px; }
.grid2 { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; margin-top: 20px; }
.row { display: flex; align-items: center; gap: 10px; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.queue .big { margin: 14px 0 4px; }
.queue .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
.tile { background: var(--card); border-radius: 14px; padding: 12px; }
.tile .n { font-size: 20px; font-weight: 600; }
.tile .t { font-size: 13px; color: var(--muted); line-height: 1.4; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; background: var(--card); border-radius: 24px; padding: 12px; }
.stat { background: var(--panel); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; min-height: 156px; border: 0; text-align: start; }
.stat .t { font-weight: 500; }
.stat .big { margin: 10px 0 8px; }
.stat.hero { background: linear-gradient(150deg, #e2602c 0%, #d34513 55%, #b93a10 100%); color: #fffdf8; }
.stat.hero .chip { background: rgba(255, 253, 248, .2); color: #fffdf8; }
.stat .ic { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--card); }
.stat.hero .ic { background: rgba(255, 253, 248, .2); }
.chart { display: flex; flex-direction: column; overflow: hidden; }
.chart .inner { flex: 1; display: flex; flex-direction: column; margin-top: 14px; }
.legend { display: flex; gap: 14px; font-size: 13px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 6px; vertical-align: -1px; }
.plot { flex: 1; display: grid; grid-template-columns: auto 1fr; gap: 8px; margin-top: 12px; min-height: 230px; }
.yaxis { display: flex; flex-direction: column-reverse; justify-content: space-between; font-size: 12px; color: var(--muted); padding-bottom: 32px; line-height: 1; }
.bars { position: relative; display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; align-items: end; }
.bars .gl { position: absolute; inset-inline: 0; border-top: 1px dashed var(--line); }
.bar { display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; position: relative; z-index: 1; }
.bar .stack { width: min(26px, 70%); display: flex; flex-direction: column; justify-content: flex-end; height: calc(100% - 38px); }
.bar .seg { border-radius: 7px; transform-origin: bottom; }
.bar .seg + .seg { margin-top: 3px; }
.bar .seg.s { border: 1.5px solid var(--orange); }
.bar .seg.k { background: var(--primary); }
.bar .lbl { height: 38px; padding-top: 6px; font-size: 12px; line-height: 1.25; color: var(--muted); text-align: center; }
.bar:hover .tip { display: block; }
.tip { position: absolute; bottom: calc(100% - 20px); inset-inline-start: 50%; transform: translateX(50%); background: var(--primary); color: var(--primary-fg); font-size: 12px; padding: 4px 8px; border-radius: 8px; white-space: nowrap; display: none; pointer-events: none; z-index: 2; }
.track { height: 12px; border-radius: 999px; display: flex; gap: 3px; margin: 16px 0 12px; }
.track span { border-radius: 999px; height: 100%; transition: flex-grow .9s cubic-bezier(.2, .7, .2, 1); }
.track .rest { background: repeating-linear-gradient(-45deg, var(--line) 0 2px, transparent 2px 6px); }
.keys { display: grid; gap: 8px; }
.keys div { display: flex; justify-content: space-between; gap: 10px; }
.keys i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 8px; }
table { width: 100%; border-collapse: separate; border-spacing: 0; }
th { text-align: start; font-weight: 500; font-size: 14px; color: var(--muted); padding: 10px 12px; background: var(--panel); }
th:first-child { border-start-start-radius: 14px; border-end-start-radius: 14px; }
th:last-child { border-start-end-radius: 14px; border-end-end-radius: 14px; }
td { padding: 12px; border-bottom: 1px solid var(--line); }
tr:last-child td { border-bottom: 0; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--panel); }
.empty-box { text-align: center; padding: 34px 16px; color: var(--muted); }
.empty-box b { display: block; color: var(--fg); font-weight: 600; margin-bottom: 4px; }

/* messages page */
.box { display: grid; grid-template-columns: 360px minmax(0, 1fr) 300px; background: var(--card); border-radius: 24px; height: calc(100vh - 250px); min-height: 560px; overflow: hidden; }
.lst { border-inline-end: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.lst .tools { padding: 16px 16px 10px; }
.search { display: flex; align-items: center; gap: 8px; height: 44px; border-radius: 999px; background: var(--panel); padding: 0 14px; color: var(--muted); }
.search input { flex: 1; border: 0; background: none; outline: none; color: var(--fg); font-size: 16px; min-width: 0; }
.seg-tabs { display: flex; gap: 2px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
.seg-tabs button { border: 0; background: none; height: 34px; padding: 0 8px; border-radius: 999px; font-size: 14px; white-space: nowrap; color: var(--muted); }
.seg-tabs button.on { background: var(--panel); color: var(--fg); font-weight: 500; }
.seg-tabs b { font-weight: 500; margin-inline-start: 5px; }
.items { overflow-y: auto; overflow-x: hidden; flex: 1; padding: 0 8px 12px; }
.item { display: flex; gap: 12px; width: 100%; border: 0; background: none; text-align: start; padding: 12px 10px; border-radius: 16px; position: relative; margin-top: 2px; }
.item:hover { background: var(--panel); }
.item.on { background: var(--panel); }
.item.on::before { content: ""; position: absolute; inset-inline-start: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 3px; background: var(--orange); }
.av { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); }
.av.hot { background: var(--orange); color: #fffdf8; }
.item .body { flex: 1; min-width: 0; }
.item .l1 { display: flex; justify-content: space-between; gap: 8px; font-weight: 500; }
.item .l2 { display: block; color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item.done { opacity: .6; }
.conv { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.conv .hd { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.conv .hd h2 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.3; }
.conv .hd .back { display: none; }
.conv .scroll { flex: 1; overflow-y: auto; padding: 22px 24px 30px; }
.bubble { background: var(--panel); border-radius: 18px; border-start-start-radius: 6px; padding: 14px 16px; max-width: 620px; white-space: pre-wrap; font-size: 16px; }
.who { font-size: 13px; color: var(--muted); margin: 0 4px 6px; }
.draft { margin-top: 26px; border: 1px solid var(--line); border-radius: 20px; padding: 16px; max-width: 760px; }
.draft textarea { display: block; width: 100%; border: 0; background: none; resize: none; outline: none; font-size: 16px; line-height: 1.75; padding: 6px 2px; min-height: 90px; overflow: hidden; }
.draft:focus-within { border-color: var(--orange); }
.flag { margin-top: 10px; padding: 10px 14px; border-radius: 14px; background: var(--orange-soft); color: var(--orange-ink); font-size: 14px; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.decided { margin-top: 12px; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
.info { border-inline-start: 1px solid var(--line); overflow-y: auto; padding: 16px; display: grid; gap: 12px; align-content: start; }
.info h3 { margin: 0 0 10px; font-size: 15px; font-weight: 600; }
dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 0; font-size: 14px; }
dt { color: var(--muted); }
dd { margin: 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sure { color: var(--muted); direction: ltr; unicode-bidi: isolate; font-size: 13px; }
.reasons { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 14px; }
.reasons li { display: flex; gap: 8px; }
.reasons li::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--orange); margin-top: 9px; }
.txn { background: var(--card); border-radius: 12px; padding: 10px 12px; margin-top: 8px; font-size: 14px; display: grid; gap: 2px; }
.nothing { padding: 40px 24px; color: var(--muted); }

/* states */
.sk { border-radius: 24px; background: var(--card); position: relative; overflow: hidden; }
.sk::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, var(--panel), transparent); animation: shimmer 1.3s infinite; }
@keyframes shimmer { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
.err { max-width: 460px; margin: 40px auto; text-align: center; }
.err p { color: var(--muted); }
.toast { position: fixed; bottom: 24px; white-space: nowrap; max-width: calc(100vw - 32px); inset-inline-start: 50%; transform: translate(50%, 20px); opacity: 0; background: var(--primary); color: var(--primary-fg); padding: 12px 20px; border-radius: 999px; display: flex; align-items: center; gap: 10px; transition: opacity .25s, transform .25s; z-index: 30; pointer-events: none; }
.toast.show { opacity: 1; transform: translate(50%, 0); }
.toast.bad { background: var(--red); color: #fffdf8; }

/* motion */
.rv { animation: rv .5s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i, 0) * 70ms); }
@keyframes rv { from { opacity: 0; filter: blur(10px); transform: translateY(6px); } }
.grow { animation: grow .8s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(300ms + var(--i, 0) * 60ms); }
@keyframes grow { from { transform: scaleY(0); } }
::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
@media (prefers-reduced-motion: reduce) {
  .rv, .grow { animation: fade .2s both; }
  @keyframes fade { from { opacity: 0; } }
  .nav .ind, .track span { transition: none; }
}

/* drawer for phones */
.drawer { position: fixed; inset: 0; z-index: 20; display: none; }
.drawer.open { display: block; }
.drawer .shade { position: absolute; inset: 0; background: rgba(0, 0, 0, .35); }
.drawer nav { position: absolute; inset-block: 10px; inset-inline-start: 10px; width: min(300px, 80vw); background: var(--card); border-radius: 24px; padding: 18px; display: grid; gap: 6px; align-content: start; }
.drawer nav button { height: 48px; border: 0; border-radius: 999px; background: none; text-align: start; padding: 0 18px; font-size: 16px; }
.drawer nav button.on { background: var(--primary); color: var(--primary-fg); }

@media (max-width: 1280px) {
  .grid1 { grid-template-columns: 1fr 1fr; }
  .grid1 .chart { grid-column: 1 / -1; }
  .box { grid-template-columns: 320px minmax(0, 1fr); }
  .info { display: none; }
  .conv .info-in { display: grid; gap: 12px; margin-top: 26px; max-width: 760px; grid-template-columns: 1fr 1fr; }
}
@media (min-width: 1281px) { .conv .info-in { display: none; } }
@media (max-width: 900px) {
  .nav, .icons, .me { display: none; }
  .burger { display: grid; margin-inline-start: auto; }
  .top .pill.burger { width: 54px; padding: 0; place-items: center; background: var(--card); }
  .grid1, .grid2, .stats { grid-template-columns: 1fr; }
  .stats { grid-template-columns: 1fr 1fr; }
  .box { display: block; height: auto; min-height: 0; }
  .lst { border: 0; }
  .items { max-height: none; }
  .box.reading .lst { display: none; }
  .box:not(.reading) .conv { display: none; }
  .conv .hd .back { display: grid; }
  .conv .info-in { grid-template-columns: 1fr; }
  .conv .scroll { padding: 18px 16px 24px; }
  .hide-sm { display: none; }
}
@media (max-width: 520px) {
  .app { border-radius: 24px; padding: 14px 12px 28px; }
  .queue .btns { grid-template-columns: 1fr; }
  .tiles { gap: 8px; }
  .tile { padding: 10px; }
  .stat { min-height: 136px; padding: 14px; }
  .chart .inner { overflow-x: auto; }
  .plot { min-width: 400px; }
  .acts .btn { flex: 1 1 100%; height: 46px; }
  .seg-tabs button { padding: 0 6px; font-size: 13.5px; }
  .lst .tools { padding: 14px 12px 8px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="pill logo"><span class="mk"><i></i></span>فرز</div>
    <nav class="pill nav" id="nav"><span class="ind" id="ind"></span>
      <button data-page="overview">نظرة عامة</button><button data-page="inbox">الرسائل</button>
    </nav>
    <div class="pill icons"><button class="iconbtn" data-theme-toggle title="الوضع الفاتح والغامق" aria-label="الوضع الفاتح والغامق"></button></div>
    <div class="pill me"><span class="ring" id="ring"></span><span><b id="doneline">خلصت 0</b><small>تجربة، ما يندز أي رد</small></span></div>
    <button class="pill burger iconbtn" id="burger" aria-label="القائمة"></button>
  </header>
  <div class="head" id="head"></div>
  <main id="page"></main>
</div>
<div class="drawer" id="drawer"><div class="shade" data-close></div><nav>
  <button data-page="overview">نظرة عامة</button><button data-page="inbox">الرسائل</button>
  <button data-theme-toggle>الوضع الفاتح والغامق</button>
  <p class="muted" style="margin:8px 18px 0;font-size:14px">تجربة، ما يندز أي رد وكل البيانات مخترعة</p>
</nav></div>
<div class="toast" id="toast"></div>

<script>
const CAT = { failed_transfer: "تحويل فاشل أو معلق", wrong_recipient: "تحويل لرقم غلط", login_access: "الدخول للحساب",
  agent_dispute: "مشكلة ويا وكيل", card_issue: "البطاقة", bill_payment: "دفع فاتورة أو شحن", fraud_scam: "احتيال",
  account_kyc: "توثيق الحساب", general_inquiry: "استفسار عام" };
const SHORT = { failed_transfer: "تحويل فاشل", wrong_recipient: "رقم غلط", login_access: "الدخول", agent_dispute: "وكيل",
  card_issue: "البطاقة", bill_payment: "فاتورة", fraud_scam: "احتيال", account_kyc: "توثيق", general_inquiry: "استفسار" };
const PRI = { urgent: "عاجل", high: "عالي", normal: "عادي", low: "واطي" };
const TEAM = { transfers: "التحويلات", account_access: "الحسابات", agent_network: "الوكلاء", cards: "البطاقات",
  payments: "المدفوعات", fraud: "الحماية من الاحتيال", kyc: "توثيق الحسابات", general: "خدمة الزبائن" };
const LEDGER = { match: "يطابق سجل المحفظة", mismatch: "المبلغ ما يطابق السجل", not_found: "ما لگينا العملية بالسجل",
  no_details: "ماكو مبلغ أو رقم أو رقم عملية بالرسالة" };
const TYPE = { p2p_send: "تحويل", p2p_receive: "استلام", intl_transfer: "حوالة خارجية", bill_payment: "فاتورة",
  topup: "شحن رصيد", agent_cash_in: "إيداع عند وكيل", agent_cash_out: "سحب عند وكيل", card_payment: "دفع بالبطاقة" };
const STATUS = { success: "ناجحة", failed: "فاشلة", pending: "قيد المعالجة", reversed: "مرجّعة" };
const CHOICE = { approve: "اعتمدت المسودة", edit: "عدّلت وأعتمدت", take_over: "استلمتها بنفسك" };
const PAGES = { overview: "نظرة عامة", inbox: "الرسائل" };

const P = (d, w = 18) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I = {
  sun: P('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
  moon: P('<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>'),
  menu: P('<path d="M4 7h16M4 12h16M4 17h16"/>', 20),
  search: P('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),
  person: P('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>', 16),
  draft: P('<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>', 16),
  fire: P('<path d="M12 3s5 4.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-4 1.5-4S9 12 11 12c0-4 1-9 1-9z"/>', 16),
  check: P('<path d="m5 12 4.5 4.5L19 7"/>', 16),
  back: P('<path d="m9 6 6 6-6 6"/>', 20),
  shield: P('<path d="M12 3 5 6v6c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6z"/>', 18),
  chat: P('<path d="M5 18.5 3.5 21l.5-4A8 8 0 1 1 7 19.4z"/>', 18),
};

let tickets = [], actions = {}, page = "overview", filter = "person", current = null, query = "", reading = false;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (x) => Math.round((x || 0) * 100) + "%";
const money = (n) => n == null ? "" : Number(n).toLocaleString("en-US") + " دينار";
const hot = (p) => p === "urgent" || p === "high";
const left = (fn) => tickets.filter((t) => !actions[t.id] && fn(t)).length;
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

function reason(r) {
  let m;
  if ((m = r.match(/^not sure of category \((\S+) ([\d.]+)\)/))) return `مو متأكد من نوع المشكلة (${CAT[m[1]] || "؟"}، ${pct(+m[2])})`;
  if ((m = r.match(/^not sure of priority \((\S+) ([\d.]+)\)/))) return `مو متأكد من الأهمية (${PRI[m[1]] || "؟"}، ${pct(+m[2])})`;
  if (r === "fraud or scam") return "احتيال، لازم موظف يشوفها";
  if (r === "urgent") return "عاجلة";
  if (r === "scam signs in the text") return "بالرسالة علامات احتيال";
  if (r === "text tries to instruct the system") return "الرسالة تحاول تعطي أوامر للنظام";
  if (r.startsWith("ledger: ")) return `السجل ما يطابق كلام الزبون: <span class="ltr">${esc(r.slice(8))}</span>`;
  return esc(r);
}

/* theme */
function theme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("farz-theme", t); } catch (e) {}
  document.querySelectorAll(".icons [data-theme-toggle]").forEach((b) => b.innerHTML = t === "dark" ? I.sun : I.moon);
}
function flip(e) {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  if (!document.startViewTransition || still) return theme(next);
  const x = e.clientX || innerWidth / 2, y = e.clientY || 40, r = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  document.startViewTransition(() => theme(next)).ready.then(() => document.documentElement.animate(
    { clipPath: [`circle(0 at ${x}px ${y}px)`, `circle(${r}px at ${x}px ${y}px)`] },
    { duration: 800, easing: "cubic-bezier(.6, 0, .2, 1)", pseudoElement: "::view-transition-new(root)" }));
}

/* shell */
function shell() {
  document.querySelectorAll("[data-page]").forEach((b) => b.classList.toggle("on", b.dataset.page === page));
  const on = document.querySelector(`#nav [data-page="${page}"]`);
  if (on && on.offsetWidth) {
    const ind = $("ind");
    ind.style.transition = settled ? "" : "none";
    Object.assign(ind.style, { left: on.offsetLeft + "px", width: on.offsetWidth + "px" });
  }
  const done = Object.keys(actions).length, n = tickets.length || 1, c = 2 * Math.PI * 16;
  $("ring").innerHTML = `<svg width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="var(--soft)" stroke-width="4"/>
    <circle cx="20" cy="20" r="16" fill="none" stroke="var(--orange)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${c * done / n} ${c}"/></svg>`;
  $("doneline").textContent = `خلصت ${done} من ${tickets.length}`;
}

function go(p, opts = {}) {
  page = p;
  if (opts.filter) filter = opts.filter;
  if (opts.id) { current = opts.id; reading = true; }
  try { history.replaceState(null, "", "#" + p); } catch (e) {}
  $("drawer").classList.remove("open");
  shell();
  render();
}

function render() {
  if (page === "overview") overview(); else inbox();
}

/* count-up */
function countUp() {
  document.querySelectorAll("[data-count]").forEach((el) => {
    const to = +el.dataset.count;
    if (still || !to) { el.textContent = to; return; }
    const t0 = performance.now();
    const step = (t) => { const k = Math.min(1, (t - t0) / 1100); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

/* overview page */
function overview() {
  const done = Object.values(actions);
  const person = tickets.filter((t) => t.route === "person").length;
  const astra = tickets.filter((t) => t.draft_writer === "astra").length;
  const lo = (o) => tickets.filter((t) => (t.ledger || {}).outcome === o).length;
  $("head").innerHTML = `<h1 class="rv">هلا بيك، هاي رسائل اليوم</h1>
    <p class="rv" style="--i:1">فرز رتب رسائل زبائن المحفظة وكتب مسودة لكل وحدة. تجربة على بيانات مخترعة، ما يندز أي رد.</p>`;

  const cats = Object.keys(CAT).map((k) => ({ k, p: tickets.filter((t) => t.category === k && t.route === "person").length,
    q: tickets.filter((t) => t.category === k && t.route !== "person").length }));
  const top = Math.max(5, Math.ceil(Math.max(...cats.map((c) => c.p + c.q)) / 5) * 5);
  const ticks = [0, 1, 2, 3, 4, 5].map((i) => Math.round(top * i / 5));

  const sent = done.filter((a) => a.choice === "approve" || (a.choice === "edit" && !a.changed)).length;
  const edited = done.filter((a) => a.choice === "edit" && a.changed).length;
  const taken = done.filter((a) => a.choice === "take_over").length;
  const recent = done.slice().sort((a, b) => String(b.time).localeCompare(String(a.time))).slice(0, 6);
  const byId = Object.fromEntries(tickets.map((t) => [t.id, t]));

  $("page").innerHTML = `
  <div class="grid1">
    <section class="card queue rv" style="--i:2">
      <div class="spread"><h2>كل الرسائل</h2><span class="chip">${astra} مسودة كتبتها Astra</span></div>
      <div class="big" data-count="${tickets.length}">0</div>
      <div class="row muted" style="font-size:14px"><span class="chip good">${pct(tickets.length ? done.length / tickets.length : 0)}</span>خلصت منها ${done.length}</div>
      <div class="btns"><button class="btn dark" data-go="inbox" data-filter="person">${I.person}ابدأ بالي تحتاج موظف</button>
        <button class="btn" data-go="inbox" data-filter="team_queue">${I.draft}الجاهزة بمسودة</button></div>
      <div class="inner"><div class="spread"><b style="font-weight:500">فحص سجل المحفظة</b><span class="muted" style="font-size:13px">${tickets.length - lo(undefined) - lo(null)} انفحصت</span></div>
        <div class="tiles">
          <div class="tile"><div class="n">${lo("match")}</div><div class="t">يطابق كلام الزبون</div></div>
          <div class="tile"><div class="n">${lo("mismatch") + lo("not_found")}</div><div class="t">ما يطابق أو ما لگيناها</div></div>
          <div class="tile"><div class="n">${lo("no_details")}</div><div class="t">ماكو تفاصيل بالرسالة</div></div>
        </div></div>
    </section>
    <section class="stats rv" style="--i:3">
      <button class="stat hero" data-go="inbox" data-filter="person"><div class="spread"><span class="t">تحتاج موظف</span><span class="ic">${I.person}</span></div>
        <div class="big" data-count="${left((t) => t.route === "person")}">0</div><div><span class="chip">من ${person} وصلت لموظف</span></div></button>
      <button class="stat" data-go="inbox" data-filter="team_queue"><div class="spread"><span class="t">جاهزة بمسودة</span><span class="ic">${I.draft}</span></div>
        <div class="big" data-count="${left((t) => t.route !== "person")}">0</div><div><span class="chip">تروح لقائمة الفريق</span></div></button>
      <button class="stat" data-go="inbox" data-filter="person"><div class="spread"><span class="t">عاجلة وعالية</span><span class="ic">${I.fire}</span></div>
        <div class="big" data-count="${left((t) => hot(t.priority))}">0</div><div><span class="chip hot">باقية بدون رد</span></div></button>
      <button class="stat" data-go="inbox" data-filter="done"><div class="spread"><span class="t">خلصت</span><span class="ic">${I.check}</span></div>
        <div class="big" data-count="${done.length}">0</div><div><span class="chip good">${pct(tickets.length ? done.length / tickets.length : 0)} من القائمة</span></div></button>
    </section>
    <section class="card chart rv" style="--i:4">
      <h2>الرسائل حسب المشكلة</h2><p class="sub">شكد وحدة وصلت لموظف وشكد راحت جاهزة للفريق</p>
      <div class="inner">
        <div class="legend"><span><i class="stripes" style="border:1.5px solid var(--orange)"></i>تحتاج موظف</span><span><i style="background:var(--primary)"></i>جاهزة بمسودة</span></div>
        <div class="plot">
          <div class="yaxis">${ticks.map((v) => `<span>${v}</span>`).join("")}</div>
          <div class="bars">${ticks.slice(1).map((v) => `<span class="gl" style="bottom:calc(38px + (100% - 38px) * ${v / top})"></span>`).join("")}
            ${cats.map((c, i) => `<div class="bar"><span class="tip">${CAT[c.k]}: ${c.p} لموظف، ${c.q} للفريق</span><div class="stack">
              ${c.p ? `<span class="seg s stripes grow" style="height:${c.p / top * 100}%;--i:${i}"></span>` : ""}
              ${c.q ? `<span class="seg k grow" style="height:${c.q / top * 100}%;--i:${i}"></span>` : ""}
            </div><span class="lbl">${SHORT[c.k]}</span></div>`).join("")}
          </div>
        </div>
      </div>
    </section>
  </div>
  <div class="grid2">
    <section class="card rv" style="--i:5">
      <h2>قراراتك على المسودات</h2><p class="sub">${done.length ? `${done.length} قرار لحد هسه` : "بعدك ما قررت على أي مسودة"}</p>
      <div class="track">${done.length ? `<span style="flex-grow:${sent};background:var(--primary)"></span><span style="flex-grow:${edited};background:var(--orange)"></span>
        <span class="stripes" style="flex-grow:${taken};border:1.5px solid var(--orange)"></span>` : ""}<span class="rest" style="flex-grow:${done.length ? 0 : 1}"></span></div>
      <div class="keys">
        <div><span><i style="background:var(--primary)"></i>اعتمدتها مثل ما هي</span><b>${sent}</b></div>
        <div><span><i style="background:var(--orange)"></i>عدلت عليها</span><b>${edited}</b></div>
        <div><span><i class="stripes" style="border:1.5px solid var(--orange)"></i>استلمتها وكتبت ردك</span><b>${taken}</b></div>
      </div>
    </section>
    <section class="card rv" style="--i:6">
      <div class="spread"><h2>آخر قراراتك</h2>${done.length ? `<button class="btn" data-go="inbox" data-filter="done">شوف الكل</button>` : ""}</div>
      ${recent.length ? `<div style="overflow-x:auto;margin-top:14px"><table><thead><tr><th>الرسالة</th><th class="hide-sm">الأهمية</th><th>قرارك</th><th class="hide-sm">الوقت</th></tr></thead><tbody>
        ${recent.map((a) => { const t = byId[a.id] || {}; return `<tr data-open="${esc(a.id)}"><td>${CAT[t.category] || "؟"}</td>
          <td class="hide-sm"><span class="chip ${hot(t.priority) ? "hot" : ""}">${PRI[t.priority] || "؟"}</span></td>
          <td>${CHOICE[a.choice]}</td><td class="hide-sm ltr muted">${esc(String(a.time).slice(5, 16))}</td></tr>`; }).join("")}
      </tbody></table></div>` : `<div class="empty-box"><b>ماكو قرارات بعد</b>افتح الرسائل واعتمد أول مسودة، وراح تطلع هنا</div>`}
    </section>
  </div>`;
  countUp();
}

/* messages page */
function shown() {
  const q = query.trim().toLowerCase();
  return tickets.filter((t) => (filter === "all" || (filter === "done" ? actions[t.id] : !actions[t.id] && t.route === filter)) &&
    (!q || t.text.toLowerCase().includes(q) || (CAT[t.category] || "").includes(q) || t.id.toLowerCase().includes(q) || (t.wallet_phone || "").includes(q)));
}

function inbox() {
  $("head").innerHTML = `<h1 class="rv">الرسائل</h1><p class="rv" style="--i:1">اعتمد المسودة، عدلها، أو استلم الرسالة بنفسك</p>`;
  if (!current || !tickets.some((t) => t.id === current)) current = (shown()[0] || tickets[0] || {}).id;
  $("page").innerHTML = `<div class="box rv ${reading ? "reading" : ""}" id="box" style="--i:2">
    <aside class="lst"><div class="tools">
      <label class="search">${I.search}<input id="q" type="search" placeholder="دور بالرسائل" value="${esc(query)}" autocomplete="off"></label>
      <div class="seg-tabs" id="filters"></div></div>
      <div class="items" id="items"></div></aside>
    <section class="conv" id="conv"></section>
    <aside class="info" id="info"></aside></div>`;
  items();
  detail();
}

function items() {
  const f = [["person", "تحتاج موظف", left((t) => t.route === "person")], ["team_queue", "جاهزة", left((t) => t.route !== "person")],
    ["done", "خلصت", Object.keys(actions).length], ["all", "الكل", tickets.length]];
  $("filters").innerHTML = f.map(([k, v, n]) => `<button class="${filter === k ? "on" : ""}" data-filter-only="${k}">${v}<b>${n}</b></button>`).join("");
  const list = shown();
  $("items").innerHTML = list.length ? list.map((t) => {
    const a = actions[t.id];
    return `<button class="item ${t.id === current ? "on" : ""} ${a && filter !== "done" ? "done" : ""}" data-id="${t.id}">
      <span class="av ${!a && hot(t.priority) ? "hot" : ""}">${a ? I.check : t.category === "fraud_scam" ? I.shield : I.chat}</span>
      <span class="body"><span class="l1"><span>${CAT[t.category] || "غير معروف"}</span>
        ${a ? `<span class="chip good">${CHOICE[a.choice]}</span>` : `<span class="chip ${hot(t.priority) ? "hot" : ""}">${PRI[t.priority] || ""}</span>`}</span>
      <span class="l2" dir="auto">${esc(t.text)}</span></span></button>`;
  }).join("") : `<div class="empty-box"><b>${query ? "ما لگينا شي" : filter === "done" ? "بعدك ما خلصت شي" : "خلصت كل هاي"}</b>${query ? "جرب كلمة ثانية أو امسح البحث" : "اختار قائمة ثانية من فوق"}</div>`;
}

function infoPanels(t) {
  const ld = t.ledger || {};
  const none = '<span class="muted">ماكو</span>';
  return `
    <div class="inner"><h3>شنو لگى فرز</h3><dl>
      <dt>المشكلة</dt><dd>${CAT[t.category] || "؟"}<span class="sure">${pct(t.category_confidence)}</span></dd>
      <dt>الأهمية</dt><dd><span class="chip ${hot(t.priority) ? "hot" : ""}">${PRI[t.priority] || "؟"}</span><span class="sure">${pct(t.priority_confidence)}</span></dd>
      <dt>الفريق</dt><dd>${TEAM[t.team] || "؟"}</dd>
      <dt>وين راحت</dt><dd>${t.route === "person" ? "لموظف أولاً" : "لقائمة الفريق"}</dd>
      <dt>رقم الرسالة</dt><dd><span class="ltr">${esc(t.id)}</span></dd>
    </dl></div>
    ${t.reasons && t.reasons.length ? `<div class="inner"><h3>ليش وصلتك</h3><ul class="reasons">${t.reasons.map((r) => `<li><span>${reason(r)}</span></li>`).join("")}</ul></div>` : ""}
    <div class="inner"><h3>التفاصيل من الرسالة</h3><dl>
      <dt>المبلغ</dt><dd>${t.entities.amount != null ? money(t.entities.amount) : none}</dd>
      <dt>رقم الهاتف</dt><dd>${t.entities.phone ? `<span class="ltr">${esc(t.entities.phone)}</span>` : none}</dd>
      <dt>رقم العملية</dt><dd>${t.entities.reference ? `<span class="ltr">${esc(t.entities.reference)}</span>` : none}</dd>
    </dl></div>
    <div class="inner"><h3>سجل المحفظة</h3>
      <div style="font-size:14px">${t.ledger ? `<span class="chip ${ld.outcome === "match" ? "good" : ld.outcome === "no_details" ? "" : "bad"}">${LEDGER[ld.outcome] || esc(ld.outcome)}</span>` : '<span class="muted">ما انفحص، المشكلة مو عن عملية</span>'}</div>
      ${(t.ledger_rows || []).map((x) => `<div class="txn"><span class="ltr">${esc(x.ref)}</span>
        <span>${TYPE[x.type] || esc(x.type)}، ${money(x.amount)}</span>
        <span>${STATUS[x.status] || esc(x.status)}${x.debited ? "، منخصم" : ""}</span>
        <span class="ltr muted">${esc(x.time.replace("T", " "))}</span></div>`).join("")}
    </div>`;
}

function detail() {
  const t = tickets.find((x) => x.id === current);
  if (!t) { $("conv").innerHTML = `<div class="nothing">ماكو رسالة مفتوحة</div>`; $("info").innerHTML = ""; return; }
  const a = actions[t.id], lang = t.reply_language === "english" ? "en" : "ar";
  $("conv").innerHTML = `
    <div class="hd"><button class="iconbtn back" id="back" aria-label="رجوع للقائمة">${I.back}</button>
      <span class="av ${hot(t.priority) ? "hot" : ""}">${t.category === "fraud_scam" ? I.shield : I.chat}</span>
      <div style="flex:1;min-width:0"><h2>${CAT[t.category] || "غير معروف"}</h2><div class="muted" style="font-size:14px">محفظة الزبون <span class="ltr">${esc(t.wallet_phone)}</span></div></div>
      <span class="chip ${hot(t.priority) ? "hot" : ""}">${PRI[t.priority] || ""}</span></div>
    <div class="scroll" id="scroll">
      <div class="who">الزبون</div>
      <div class="bubble" dir="auto">${esc(t.text)}</div>
      <div class="draft">
        <div class="spread"><b style="font-weight:600">مسودة الرد</b><span class="chip">${t.draft_writer === "astra" ? "كتبتها Astra" : "من قالب ثابت"}</span></div>
        <textarea id="draft" dir="${lang === "en" ? "ltr" : "rtl"}" lang="${lang}" aria-label="مسودة الرد">${esc(a && a.sent_text != null ? a.sent_text : t.draft)}</textarea>
      </div>
      ${(t.draft_problems || []).length ? `<div class="flag" style="max-width:760px">انتبه، الفحص لگى بالمسودة: <span class="ltr">${esc(t.draft_problems.join("; "))}</span></div>` : ""}
      <div class="acts">
        <button class="btn dark" data-choice="approve" title="Ctrl+Enter">${I.check}اعتمد المسودة</button>
        <button class="btn" data-choice="edit">احفظ تعديلي واعتمده</button>
        <button class="btn" data-choice="take_over">أستلمها بنفسي</button>
      </div>
      ${a ? `<div class="decided"><span class="chip good">${CHOICE[a.choice]}</span><span class="ltr">${esc(a.time)}</span></div>` : ""}
      <div class="info-in">${infoPanels(t)}</div>
    </div>`;
  $("info").innerHTML = infoPanels(t);
  $("scroll").scrollTop = 0; $("info").scrollTop = 0;
  grow($("draft"));
}

function pick(id) {
  current = id; reading = true;
  $("box").classList.add("reading");
  items(); detail();
  if (innerWidth <= 900) scrollTo({ top: $("box").offsetTop - 10 });
}

let busy = false;
async function act(choice) {
  if (!current || busy) return;
  busy = true;
  document.querySelectorAll("[data-choice]").forEach((b) => b.disabled = true);
  try {
    const res = await fetch("/api/action", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: current, choice, text: $("draft").value }) });
    if (!res.ok) throw new Error(res.status);
    actions[current] = await res.json();
    toast(`انحفظ، ${CHOICE[choice]}`);
    shell();
    const next = shown().find((t) => !actions[t.id]);
    if (next) current = next.id;
    items(); detail();
  } catch (e) {
    toast("ما انحفظ، جرب مرة ثانية", true);
    document.querySelectorAll("[data-choice]").forEach((b) => b.disabled = false);
  } finally { busy = false; }
}

let toastTimer;
function toast(text, bad) {
  const el = $("toast");
  el.innerHTML = (bad ? "" : I.check) + esc(text);
  el.className = "toast show" + (bad ? " bad" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

function grow(el) { if (!el) return; el.style.height = "auto"; el.style.height = el.scrollHeight + 2 + "px"; }

document.addEventListener("click", (e) => {
  const b = e.target.closest("button, tr[data-open], [data-close]");
  if (!b) return;
  if (b.hasAttribute("data-theme-toggle")) flip(e);
  else if (b.dataset.close != null) $("drawer").classList.remove("open");
  else if (b.id === "burger") $("drawer").classList.add("open");
  else if (b.dataset.open) go("inbox", { filter: "done", id: b.dataset.open });
  else if (b.dataset.go) { reading = false; current = null; go(b.dataset.go, { filter: b.dataset.filter }); }
  else if (b.dataset.page) { reading = false; go(b.dataset.page); }
  else if (b.dataset.filterOnly) { filter = b.dataset.filterOnly; items(); }
  else if (b.dataset.id) pick(b.dataset.id);
  else if (b.dataset.choice) act(b.dataset.choice);
  else if (b.id === "back") { reading = false; $("box").classList.remove("reading"); }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "draft") grow(e.target);
  if (e.target.id === "q") { query = e.target.value; items(); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && page === "inbox" && current) { e.preventDefault(); act("approve"); }
  if (e.key === "Escape") $("drawer").classList.remove("open");
});
addEventListener("resize", shell);
let settled = false;
document.fonts.ready.then(() => { shell(); grow($("draft")); setTimeout(() => settled = true, 400); });

function skeleton() {
  $("head").innerHTML = `<div class="sk" style="height:40px;width:min(420px,80%);border-radius:14px"></div><div class="sk" style="height:18px;width:min(520px,90%);margin-top:12px;border-radius:8px"></div>`;
  $("page").innerHTML = `<div class="grid1"><div class="sk" style="height:340px"></div><div class="sk" style="height:340px"></div><div class="sk chart" style="height:340px"></div></div>
    <div class="grid2"><div class="sk" style="height:200px"></div><div class="sk" style="height:200px"></div></div>`;
}

function load() {
  skeleton();
  fetch("/api/queue").then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then((d) => {
    tickets = d.tickets || []; actions = d.actions || {};
    if (!tickets.length) {
      $("head").innerHTML = `<h1>ماكو رسائل</h1>`;
      $("page").innerHTML = `<div class="card err"><b>القائمة فارغة</b><p>شغّل فرز على ملف رسائل وارجع افتح الصفحة</p></div>`;
      return shell();
    }
    go(location.hash === "#inbox" ? "inbox" : "overview");
  }).catch(() => {
    $("head").innerHTML = `<h1>الرسائل</h1>`;
    $("page").innerHTML = `<div class="card err"><b>ما گدرنا نجيب الرسائل</b><p>تأكد إن شاشة فرز بعدها شغالة على هذا الجهاز</p><button class="btn dark" id="retry">جرب مرة ثانية</button></div>`;
    $("retry").onclick = load;
  });
}

let saved = null;
try { saved = localStorage.getItem("farz-theme"); } catch (e) {}
theme(saved || "light");
$("burger").innerHTML = I.menu;
shell();
load();
</script>
</body>
